type: object
properties:
  top:
    type: array
    items:
      $ref: ./LeaderboardEntry.yaml
  my_rank:
    type: object
    nullable: true
    properties:
      rank:
        type: integer
      player_id:
        type: string
        format: uuid
      username:
        type: string
      wins:
        type: integer
      losses:
        type: integer
      total_games:
        type: integer
      win_rate:
        type: number
        format: float
      hit_rate:
        type: number
        format: float
required:
  - top
