openapi: 3.0.3
info:
  title: Sea Battle API
  version: 1.0.0
paths:
  /auth/login:
    $ref: paths/auth_login.yaml
  /auth/register:
    $ref: paths/auth_register.yaml
  /auth/2fa/setup:
    $ref: paths/auth_2fa_setup.yaml
  /auth/2fa/verify:
    $ref: paths/auth_2fa_verify.yaml
  /auth/2fa/disable:
    $ref: paths/auth_2fa_disable.yaml
  /profile:
    $ref: paths/profile.yaml
  /profile/password:
    $ref: paths/profile_password.yaml
  /lobbies:
    $ref: paths/lobbies.yaml
  /lobbies/{lobbyId}:
    $ref: paths/lobby.yaml
  /lobbies/{lobbyId}/join:
    $ref: paths/lobby_join.yaml
  /lobbies/join-by-code:
    $ref: paths/lobby_join_code.yaml
  /matchmaking/quick:
    $ref: paths/matchmaking.yaml
  /matchmaking/status:
    $ref: paths/matchmaking_status.yaml
  /games/{gameId}:
    $ref: paths/game.yaml
  /games/{gameId}/move:
    $ref: paths/game_move.yaml
  /games/{gameId}/result:
    $ref: paths/game_result.yaml
  /games/{gameId}/rematch:
    $ref: paths/game_rematch.yaml
  /leaderboard:
    $ref: paths/leaderboard.yaml
components:
  schemas:
    User:
      $ref: components/schemas/User.yaml
    Error:
      $ref: components/schemas/Error.yaml
    Profile:
      $ref: components/schemas/Profile.yaml
    Lobby:
      $ref: components/schemas/Lobby.yaml
    CreateLobbyRequest:
      $ref: components/schemas/CreateLobbyRequest.yaml
    CreateLobbyResponse:
      $ref: components/schemas/CreateLobbyResponse.yaml
    JoinByCodeRequest:
      $ref: components/schemas/JoinByCodeRequest.yaml
    GameState:
      $ref: components/schemas/GameState.yaml
    MoveRequest:
      $ref: components/schemas/MoveRequest.yaml
    MoveResponse:
      $ref: components/schemas/MoveResponse.yaml
    GameResult:
      $ref: components/schemas/GameResult.yaml
    MatchmakingStatus:
      $ref: components/schemas/MatchmakingStatus.yaml
    LeaderboardEntry:
      $ref: components/schemas/LeaderboardEntry.yaml
    LeaderboardResponse:
      $ref: components/schemas/LeaderboardResponse.yaml
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
