post:
  operationId: authenticate2FA
  summary: Подтвердить 2FA код и получить JWT (второй шаг логина)
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            temp_token:
              type: string
              description: Временный токен из /auth/login (когда 2FA включена)
            code:
              type: string
              description: 6-значный код из TOTP-приложения
          required:
            - temp_token
            - code
  responses:
    '200':
      description: Успешная аутентификация, выдан JWT
      content:
        application/json:
          schema:
            type: object
            properties:
              token:
                type: string
    '401':
      description: Неверный код или истёк срок temp_token
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
