post:
  operationId: setup2FA
  summary: Начать настройку 2FA (отправляет код на email)
  security:
    - BearerAuth: []
  responses:
    '200':
      description: Код отправлен на email
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
    '401':
      description: Не авторизован
    '409':
      description: 2FA уже включена
