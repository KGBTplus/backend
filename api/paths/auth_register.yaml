post:
  operationId: register
  summary: Регистрация нового пользователя
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            username:
              type: string
              minLength: 4
              maxLength: 16
              description: От 4 до 16 символов
            password:
              type: string
              minLength: 8
              maxLength: 20
              description: От 8 до 20 символов
            email:
              type: string
              format: email
              description: Должен быть корректный email
          required:
            - username
            - password
            - email
  responses:
    '201':
      description: Пользователь успешно создан
    '400':
      description: Ошибка валидации (длина имени/пароля, пустой email, неверный формат)
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
    '409':
      description: Пользователь с таким именем или email уже существует
    '500':
      description: Ошибка сервера