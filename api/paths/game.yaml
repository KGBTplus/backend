get:
  operationId: getGameState
  summary: Получить текущее состояние игры
  security:
    - BearerAuth: []
  parameters:
    - name: gameId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    '200':
      description: Состояние игры
      content:
        application/json:
          schema:
            $ref: ../components/schemas/GameState.yaml
    '401':
      description: Не авторизован
    '403':
      description: Вы не участник этой игры
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Error.yaml
    '404':
      description: Игра не найдена
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Error.yaml
