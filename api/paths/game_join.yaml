post:
  operationId: joinGame
  summary: Присоединиться к игре
  security:
    - BearerAuth: []
  parameters:
    - name: gameId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    '200':
      description: Присоединился
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Game.yaml
    '401':
      description: Не авторизован
    '404':
      description: Игра не найдена
    '409':
      description: Игра уже заполнена
