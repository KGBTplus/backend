post:
  operationId: makeMove
  summary: Сделать ход
  security:
    - BearerAuth: []
  parameters:
    - name: gameId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            x:
              type: integer
              minimum: 0
              maximum: 9
            y:
              type: integer
              minimum: 0
              maximum: 9
          required:
            - x
            - y
  responses:
    '200':
      description: Ход выполнен
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Game.yaml
    '400':
      description: Некорректный ход
    '401':
      description: Не авторизован
    '404':
      description: Игра не найдена
