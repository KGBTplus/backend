post:
  operationId: placeShips
  summary: Расставить корабли вручную с проверкой корректности
  security:
    - BearerAuth: []
  parameters:
    - name: gameId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            ships:
              type: array
              description: Набор из 10 кораблей. Валидация: 1×4 + 2×3 + 3×2 + 4×1, без пересечений и касаний
              items:
                type: object
                properties:
                  ship_type:
                    type: integer
                    minimum: 1
                    maximum: 4
                    description: 1=однопалубный, 2=двухпалубный, 3=трёхпалубный, 4=четырёхпалубный
                  start_x:
                    type: integer
                    minimum: 0
                    maximum: 9
                  start_y:
                    type: integer
                    minimum: 0
                    maximum: 9
                  horizontal:
                    type: boolean
                    description: true — горизонтально, false — вертикально
                required:
                  - ship_type
                  - start_x
                  - start_y
                  - horizontal
  responses:
    '200':
      description: Корабли расставлены корректно
      content:
        application/json:
          schema:
            type: object
            properties:
              ships:
                type: array
                items:
                  $ref: ../components/schemas/Ship.yaml
              message:
                type: string
    '400':
      description: Некорректная расстановка (пересечение, касание, неверное количество, выход за границы)
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Error.yaml
    '401':
      description: Не авторизован
    '403':
      description: Вы не участник этой игры
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Error.yaml
    '404':
      description: Игра не найдена
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Error.yaml
    '409':
      description: Игра не в фазе расстановки
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Error.yaml
