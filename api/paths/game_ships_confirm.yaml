post:
  operationId: confirmShips
  summary: Подтвердить готовность (расстановка завершена)
  security:
    - BearerAuth: []
  parameters:
    - name: gameId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    '200':
      description: Готовность подтверждена
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: string
                enum:
                  - waiting_for_opponent
                  - playing
              message:
                type: string
    '400':
      description: Корабли ещё не расставлены
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Error.yaml
    '401':
      description: Не авторизован
    '403':
      description: Вы не участник этой игры
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Error.yaml
    '404':
      description: Игра не найдена
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Error.yaml
