get:
  operationId: getLobby
  summary: Получить информацию о лобби (включая код-приглашение для создателя)
  security:
    - BearerAuth: []
  parameters:
    - name: lobbyId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    '200':
      description: Информация о лобби
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Lobby.yaml
    '401':
      description: Не авторизован
    '404':
      description: Лобби не найдено
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Error.yaml
