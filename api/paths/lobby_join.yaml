post:
  operationId: joinLobby
  summary: Присоединиться к лобби по ID
  security:
    - BearerAuth: []
  parameters:
    - name: lobbyId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    '200':
      description: Успешно присоединились, ожидание начала игры
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
              lobby_id:
                type: string
                format: uuid
    '401':
      description: Не авторизован
    '404':
      description: Лобби не найдено
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Error.yaml
    '409':
      description: Лобби уже заполнено или игра уже началась
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Error.yaml
