post:
  operationId: leaveLobby
  summary: Покинуть лобби
  security:
    - BearerAuth: []
  parameters:
    - name: lobbyId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    '200':
      description: Вышли из лобби
    '401':
      description: Не авторизован
    '403':
      description: Вы не в этом лобби
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Error.yaml
    '404':
      description: Лобби не найдено
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Error.yaml
