put:
  operationId: changePassword
  summary: Изменить пароль
  security:
    - BearerAuth: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            old_password:
              type: string
              minLength: 8
              maxLength: 20
            new_password:
              type: string
              minLength: 8
              maxLength: 20
          required:
            - old_password
            - new_password
  responses:
    '200':
      description: Пароль изменён
    '400':
      description: Некорректная длина пароля
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Error.yaml
    '401':
      description: Неверный старый пароль или не авторизован
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Error.yaml
