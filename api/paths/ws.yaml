# WebSocket /ws?token={jwt}
# 
# Подключение:
#   ws://localhost:8080/ws?token=<JWT>
# 
# После подключения сервер авторизует пользователя по JWT
# и начинает отправлять события в формате JSON.
#
# Все события имеют поле "type" и дополнительные поля:
# 
# ────────────── Матчмейкинг ──────────────
# 
# { "type": "matchmaking_searching" }
#   → Игрок в очереди быстрой игры
# 
# { "type": "match_found",
#   "game_id": "uuid" }
#   → Соперник найден, игра создана
# 
# ────────────── Расстановка ──────────────
# 
# { "type": "opponent_ships_placed" }
#   → Соперник расставил корабли (но ещё не подтвердил)
# 
# { "type": "opponent_ready" }
#   → Соперник подтвердил расстановку
# 
# { "type": "game_started",
#   "game_id": "uuid",
#   "current_turn": "uuid" }
#   → Оба готовы (или таймер истёк) — игра началась
# 
# { "type": "placement_timer",
#   "seconds_left": 45 }
#   → Таймер расстановки (периодически)
# 
# ────────────── Игровой процесс ───────────
# 
# { "type": "opponent_moved",
#   "game_id": "uuid",
#   "x": 3,
#   "y": 5,
#   "hit": true,
#   "ship_sunk": false }
#   → Соперник сделал ход
# 
# { "type": "your_turn",
#   "game_id": "uuid",
#   "move_deadline": "2026-06-11T18:00:00Z" }
#   → Теперь ваш ход (также шлётся после хода соперника)
# 
# { "type": "move_timer",
#   "game_id": "uuid",
#   "seconds_left": 30 }
#   → Таймер хода (периодически)
# 
# ────────────── Окончание игры ───────────
# 
# { "type": "game_over",
#   "game_id": "uuid",
#   "winner_id": "uuid",
#   "winner_username": "player1",
#   "win_reason": "all_ships_sunk" | "forfeit" | "timeout",
#   "player1_ships_sunk": 5,
#   "player2_ships_sunk": 3 }
#   → Игра завершена
# 
# { "type": "opponent_forfeited" }
#   → Соперник сдался
# 
# ────────────── Реванш ──────────────────
# 
# { "type": "rematch_requested",
#   "game_id": "uuid" }
#   → Соперник хочет реванш
# 
# { "type": "rematch_accepted",
#   "new_game_id": "uuid" }
#   → Реванш принят, новая игра создана
# 
# ────────────── Ошибки ──────────────────
# 
# { "type": "error",
#   "message": "Описание ошибки" }
#   → Ошибка авторизации или другая проблема
#
# ────────────── Pong ────────────────────
# 
# Клиент должен отправлять { "type": "ping" } раз в 30 секунд.
# Сервер отвечает { "type": "pong" }.
# Если клиент не шлёт ping 60 секунд — соединение закрывается.
