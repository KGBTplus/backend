# Patch cert-manager controller deployment to enable Gateway API support.
# Apply with: kubectl patch deployment cert-manager -n cert-manager --patch-file cert-manager-controller-patch.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  template:
    spec:
      containers:
        - name: cert-manager-controller
          args:
            - --v=2
            - --cluster-resource-namespace=$(POD_NAMESPACE)
            - --leader-election-namespace=kube-system
            - --acme-http01-solver-image=quay.io/jetstack/cert-manager-acmesolver:v1.17.1
            - --max-concurrent-challenges=60
            - --feature-gates=ExperimentalGatewayAPISupport=true
            - --enable-gateway-api
