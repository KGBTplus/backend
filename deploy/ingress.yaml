apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sea-battle-ingress-api
  namespace: sea-battle
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/use-regex: "true"
spec:
  ingressClassName: nginx
  rules:
    - host: team4.verstack.ru
      http:
        paths:
          - path: /api(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: backend
                port:
                  number: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sea-battle-ingress-frontend
  namespace: sea-battle
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - team4.verstack.ru
      secretName: team4-verstack-tls
  rules:
    - host: team4.verstack.ru
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sea-battle-frontend-service
                port:
                  number: 80
